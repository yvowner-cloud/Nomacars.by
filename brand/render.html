<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
  /* Источник для PNG-файлов бренда: открывается в браузере, каждая .art снимается отдельно (brand/render.js) */
  body { margin: 0; background: #777; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .art { position: relative; overflow: hidden; background: #000; }
  .n { position: absolute; inset: 0; display: grid; place-items: center; }
  .n svg { width: 72%; height: 72%; }

  /* Instagram: аватар (обрезается в круг) */
  #ig-avatar { width: 1080px; height: 1080px; }
  #ig-avatar .n svg { width: 56%; height: 56%; margin-top: -120px; }
  #ig-avatar .word { position: absolute; left: 0; right: 0; bottom: 215px; text-align: center; font: 700 104px/1 "Oswald", sans-serif; color: #fff; letter-spacing: .08em; }
  #ig-avatar .ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 0 transparent; }

  /* Instagram: логотип-надпись (для постов, обложек) */
  #ig-wordmark { width: 1080px; height: 1080px; display: grid; place-items: center; }
  #ig-wordmark .wm { display: flex; align-items: center; gap: 22px; margin-top: -60px; }
  #ig-wordmark .small { font: 700 38px/1.05 "Oswald", sans-serif; color: #fff; text-transform: uppercase; text-align: right; white-space: nowrap; }
  #ig-wordmark .big { font: 700 150px/.9 "Oswald", sans-serif; color: #c41f25; letter-spacing: -.005em; white-space: nowrap; }
  #ig-wordmark .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #4a4a4a; display: flex; align-items: center; justify-content: center; gap: 40px;
    font: 500 40px/1 "Oswald", sans-serif; color: #fff; text-transform: uppercase; letter-spacing: .04em; }
  #ig-wordmark .bar i { width: 10px; height: 10px; background: #c41f25; transform: rotate(45deg); display: inline-block; }
  #ig-wordmark .redline { position: absolute; left: 0; right: 0; bottom: 120px; height: 12px; background: #a8191e; }

  /* Иконки для телефонов */
  #apple { width: 180px; height: 180px; }
  #android { width: 512px; height: 512px; }
  #fav32 { width: 32px; height: 32px; border-radius: 4px; }
  #fav16 { width: 16px; height: 16px; border-radius: 2px; }
</style>
</head>
<body>
  <template id="N"><svg viewBox="0 0 64 64"><path d="M19 8h9.2l8.6 26V8H45v40h-8.6L27.6 21.5V48H19z" fill="#c41f25"/><rect x="12" y="53" width="40" height="5" fill="#c41f25"/></svg></template>

  <div class="art" id="ig-avatar"><div class="n"></div><div class="word">NOMACARS</div></div>

  <div class="art" id="ig-wordmark">
    <div class="wm"><span class="small">Авто<br>с аукционов<br>США</span><span class="big">NOMACARS</span></div>
    <div class="redline"></div>
    <div class="bar">Copart <i></i> IAAI <i></i> под ключ в РБ и РФ</div>
  </div>

  <div class="art" id="apple"><div class="n"></div></div>
  <div class="art" id="android"><div class="n"></div></div>
  <div class="art" id="fav32"><div class="n" style="inset:-1px"></div></div>
  <div class="art" id="fav16"><div class="n" style="inset:-1px"></div></div>

  <script>
    const t = document.getElementById("N").innerHTML;
    document.querySelectorAll(".n").forEach((el) => (el.innerHTML = t));
    document.querySelectorAll("#fav32 svg, #fav16 svg").forEach((s) => { s.style.width = "100%"; s.style.height = "100%"; });
  </script>
</body>
</html>
