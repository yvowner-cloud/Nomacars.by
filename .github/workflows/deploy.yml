name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package standalone build
        run: |
          mkdir -p dist
          cp -r .next/standalone/. dist/
          mkdir -p dist/.next
          cp -r .next/static dist/.next/static
          cp -r public dist/public

      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Секреты DEPLOY_* не заданы — сборка проверена, но на сервер не выкладывается. См. deploy/README.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to server and restart
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Отпечаток ECDSA-ключа сервера (не секрет). Сменили сервер — обновите значение
          # (на сервере: ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub)
          HOST_FP: ${{ vars.DEPLOY_HOST_FP || 'SHA256:Et2xdgQJTjlEa9dbkv4wb1JmVSUKH7WdFR6+wfK3PrY' }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          HOST="$(printf '%s' "$HOST" | tr -d '[:space:]')"
          PORT="$(printf '%s' "$PORT" | tr -d '[:space:]')"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Ключ мог «испачкаться» при копировании из консоли (пробелы в конце строк, переносы) —
          # собираем его заново: заголовок, тело без пробелов по 70 символов, концовка.
          python3 - > ~/.ssh/deploy <<'PY'
          import os, re, textwrap
          k = os.environ["KEY"]
          m = re.search(r"-----BEGIN ([A-Z ]+?)-----(.*?)-----END \1-----", k, re.S)
          if not m:
              print("BROKEN")
          else:
              body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(2))
              print(f"-----BEGIN {m.group(1)}-----")
              print("\n".join(textwrap.wrap(body, 70)))
              print(f"-----END {m.group(1)}-----")
          PY
          chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null || { echo "::error::DEPLOY_SSH_KEY повреждён при копировании — вставьте его заново целиком"; exit 1; }
          # Проверяем, что это именно наш сервер: сравниваем отпечаток ключа
          ssh-keyscan -p "$PORT" -t ecdsa "$HOST" 2>/dev/null > ~/.ssh/scan
          GOT="$(ssh-keygen -lf ~/.ssh/scan | awk '{print $2}')"
          if [ "$GOT" != "$HOST_FP" ]; then
            echo "::error::Отпечаток сервера не совпал (получено: ${GOT:-ничего}). Проверьте DEPLOY_HOST или обновите DEPLOY_HOST_FP."
            exit 1
          fi
          cp ~/.ssh/scan ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy -p $PORT -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ecdsa-sha2-nistp256"
          REL="/srv/nomacars/releases/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          rsync -az --delete -e "$SSH" dist/ "deploy@$HOST:$REL/"
          $SSH "deploy@$HOST" bash -s <<EOF
          set -euo pipefail
          ln -sfn "$REL" /srv/nomacars/current.new && mv -Tf /srv/nomacars/current.new /srv/nomacars/current
          sudo /usr/bin/systemctl restart nomacars
          sleep 4
          sudo /usr/bin/systemctl is-active nomacars
          curl -fsS -o /dev/null -w "Сайт отвечает: HTTP %{http_code}\n" http://127.0.0.1:3000/
          # хранить 5 последних версий для отката
          ls -1dt /srv/nomacars/releases/* | tail -n +6 | xargs -r rm -rf
          EOF
